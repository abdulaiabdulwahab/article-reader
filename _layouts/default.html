<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#142932">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if site.adsense_client != '' %}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense_client | escape }}" crossorigin="anonymous"></script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home"><span class="brand-mark">I<span class="brand-dot">.</span></span><span class="brand-name">Ink <span>&</span> Insight</span></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/' | relative_url }}#latest">Articles</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>
  {{ content }}
  <footer class="site-footer">
    <div class="container footer-grid">
      <div><a class="footer-brand" href="{{ '/' | relative_url }}">Ink & Insight<span class="accent">.</span></a><p>Slow down. Read something good.</p></div>
      <nav aria-label="Footer navigation"><a href="{{ '/' | relative_url }}">Home</a><a href="{{ '/about/' | relative_url }}">About</a><a href="{{ '/privacy/' | relative_url }}">Privacy</a><a href="{{ '/contact/' | relative_url }}">Contact</a></nav>
    </div>
    <div class="container footer-bottom">© {{ 'now' | date: '%Y' }} {{ site.title }}. All rights reserved.</div>
  </footer>
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
